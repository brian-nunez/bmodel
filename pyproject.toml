[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmodel"
version = "0.1.0"
description = "Helper functions for my homelab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=1.3.14",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
