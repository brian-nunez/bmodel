[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmodel"
version = "0.1.0"
description = "Helper functions for my homelab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=1.3.14",
]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite>=2.0.0"]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
]
